# CollabOS PostgreSQL development configuration
# Production values are much higher — these are sized for a dev laptop

listen_addresses = '*'
port = 5432
max_connections = 100

# Memory
shared_buffers = 256MB
effective_cache_size = 768MB
maintenance_work_mem = 64MB
work_mem = 4MB

# WAL
wal_buffers = 16MB
checkpoint_completion_target = 0.9
wal_level = replica                   # Enable WAL for replication/archiving
archive_mode = off                    # Enable in production with archive_command

# Query planner
default_statistics_target = 100
random_page_cost = 1.1               # SSD-optimized
effective_io_concurrency = 200       # SSD concurrent I/O

# Logging
log_min_duration_statement = 1000    # Log queries slower than 1s
log_checkpoints = on
log_connections = off
log_lock_waits = on
log_timezone = 'UTC'

# Extensions
shared_preload_libraries = 'pg_stat_statements,vector'
pg_stat_statements.max = 10000
pg_stat_statements.track = all

# Locale
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'

version: '3.9'

# Development docker-compose — starts all infrastructure services locally.
# For production, use docker-compose.prod.yml
# For observability, add: docker compose -f docker/observability.yml up -d
# For video, add:         docker compose -f docker/video.yml up -d
# For embeddings, add:    docker compose -f docker/ollama/docker-compose.yml up -d

services:

  # ── PostgreSQL with pgvector ──────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: collabos
      POSTGRES_PASSWORD: collabos_dev
      POSTGRES_DB: collabos
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=en_US.UTF-8'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U collabos']
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6381:6379'
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Redis queue (separate instance — prevents LRU eviction killing jobs) ──
  redis_queue:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - redis_queue_data:/data
    command: >
      redis-server
      --appendonly yes
      --appendfsync always
      --maxmemory 128mb
      --maxmemory-policy noeviction
      --save 60 1
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # ── MinIO (S3-compatible local storage) ───────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-07-04T14-25-45Z
    restart: unless-stopped
    ports:
      - '9000:9000'   # S3 API
      - '9001:9001'   # MinIO console
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_dev
    command: server /data --console-address ':9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO bucket setup (runs once) ────────────────────────────────────────
  minio_setup:
    image: minio/mc:RELEASE.2024-07-03T20-17-25Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin_dev;
      mc mb local/collabos --ignore-existing;
      mc mb local/collabos-backups --ignore-existing;
      mc anonymous set download local/collabos;
      echo 'MinIO setup complete';
      "

volumes:
  postgres_data:
  redis_data:
  redis_queue_data:
  minio_data:

# coturn TURN/STUN server configuration
# Replace COLLABOS_TURN_IP with your server's public IP in production

# Listening interfaces
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# External IP (set to your server's public IP in production)
# external-ip=YOUR_SERVER_PUBLIC_IP

# Authentication — shared secret mode (compatible with LiveKit)
use-auth-secret
static-auth-secret=${TURN_SECRET:-collabos_turn_secret_change_in_production}

# Realm
realm=collabos.io

# Security
no-multicast-peers
no-cli
no-software-attribute
deny-loopback-peers

# Log — stdout for Docker
log-file=stdout
verbose

# Limits
max-bps=1000000
total-quota=300
user-quota=50

# Cipher suites for TLS
# cipher-list=ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512

# TLS cert (set paths when HTTPS is configured)
# cert=/etc/coturn/tls/cert.pem
# pkey=/etc/coturn/tls/privkey.pem

# Relay addresses (uncomment and set in production)
# relay-ip=YOUR_RELAY_IP

# UDP port range for relay
min-port=49152
max-port=65535

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: collabos
    environment: production

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  # CollabOS API — exposes /metrics endpoint
  - job_name: collabos_api
    static_configs:
      - targets: ['api:3001']
    metrics_path: /metrics
    scheme: http
    bearer_token: '${METRICS_TOKEN}'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Node exporter — host system metrics (CPU, memory, disk, network)
  - job_name: node
    static_configs:
      - targets: ['node_exporter:9100']

  # PostgreSQL metrics via postgres_exporter
  - job_name: postgres
    static_configs:
      - targets: ['postgres_exporter:9187']

  # Redis metrics via redis_exporter
  - job_name: redis
    static_configs:
      - targets: ['redis_exporter:9121']

  # Loki — log aggregation
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
    metrics_path: /metrics
